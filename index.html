<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NEON VPN</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{box-sizing:border-box}

body{

 margin:0;

 padding:24px;

 background:#090b14;

 color:white;

 font-family:Arial,sans-serif;

}

header{text-align:center;padding:25px 0}

.logo{font-size:36px;font-weight:900;color:#b56cff}

.card{

 background:#171a2b;

 border:1px solid #34304e;

 border-radius:20px;

 padding:22px;

 margin:16px 0;

}

p{color:#b7b8ca}

.avatar{

 width:65px;

 height:65px;

 border-radius:50%;

 background:#a855f7;

 display:flex;

 align-items:center;

 justify-content:center;

 font-size:28px;

 margin-bottom:12px;

}

</style>

</head>

<body>

<header>

<div class="logo">NEON ⚡ VPN</div>

<p>Твоя свобода в интернете</p>

</header>

<div class="card">

<h2>👤 Мой профиль</h2>

<div class="avatar">⚡</div>

<h3 id="username">Гость NEON</h3>

<p id="userid">Telegram ID: не определён</p>

<p>Тариф: FREE</p>

<p>Статус: Аккаунт создан</p>

</div>
<div class="card">
<h3>🌍 VPN-серверы</h3>
<p>🇫🇮 Финляндия</p>
<p>🇩🇪 Германия</p>
<p>🇳🇱 Нидерланды</p>
</div>

<div class="card">
<h3>⭐ Тарифы</h3>
<p>FREE — Бесплатно</p>
<p>PREMIUM — Скоро</p>
</div>

<script>
const tg=window.Telegram.WebApp;
tg.ready();
tg.expand();

const user=tg.initDataUnsafe?.user;

if(user){
 document.getElementById('username').textContent=
 user.first_name+(user.last_name?' '+user.last_name:'');

 document.getElementById('userid').textContent=
 'Telegram ID: '+user.id;
}
</script>

</body>
</html>
