<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON VPN — Админ-панель</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="admin">
    <header class="header">
      <h1>NEON VPN</h1>
      <span>ADMIN PANEL</span>
    </header>

    <section class="welcome">
      <h2>Панель управления</h2>
      <p>Управление VPN-сервисом</p>
    </section>

    <section class="stats">
      <article class="stat">
        <span>Пользователи</span>
        <strong>—</strong>
      </article>
      <article class="stat">
        <span>Подписки</span>
        <strong>—</strong>
      </article>
      <article class="stat">
        <span>Платежи</span>
        <strong>—</strong>
      </article>
      <article class="stat">
        <span>Серверы</span>
        <strong>—</strong>
      </article>
    </section>

    <section class="notice">
      <h3>Система готовится к запуску</h3>
      <p>Данные появятся после подключения базы данных и настройки доступа администратора.</p>
    </section>
  </main>
</body>
</html>
